<div class="header-container">
    <button class="header-title" type="button" (click)="goHome()" aria-label="Back to profile">Y o o n</button>

    <!-- 넓은 화면: 홈 섹션을 바로 나열 -->
    <nav class="nav-wide" aria-label="Primary navigation">
        <button *ngFor="let s of aboutSub" class="nav-link" [class.active]="isSecActive(s.id)"
            (click)="go(s.id)">{{ s.label }}</button>
    </nav>

    <!-- 우측: Download CV -->
    <button class="cv-btn" type="button" (click)="openCv()">
        <svg class="cv-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <path d="M7 10l5 5 5-5" />
            <path d="M12 15V3" />
        </svg>
        Download CV
    </button>

    <!-- 좁은 화면: 햄버거 -->
    <button class="hamburger" [class.open]="openMenu" (click)="toggleMenu($event)" aria-label="menu">
        <span></span><span></span><span></span>
    </button>

    <div class="mobile-menu" *ngIf="openMenu" (click)="$event.stopPropagation()">
        <div class="mm-label">Overview</div>
        <a *ngFor="let s of aboutSub" class="menu-row" [class.active]="isSecActive(s.id)"
            (click)="go(s.id)">{{ s.label }}</a>
        <a class="menu-row" (click)="openCv()">Download CV</a>
    </div>
</div>
