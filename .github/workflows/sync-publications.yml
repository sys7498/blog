name: Sync publications
on:
  push:
    branches: [main]
    paths:
      - scripts/sync-publications.py
      - scripts/test_sync_publications.py
      - .github/workflows/sync-publications.yml
  schedule:
    - cron: '23 0 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-publications
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: python3 scripts/sync-publications.py
      - name: Publish bibliography changes
        shell: bash
        run: |
          if git diff --quiet -- src/assets/publications.bib; then
            echo 'No new publications.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/assets/publications.bib
          git commit -m 'Update publications from Crossref'
          git push origin HEAD:main
